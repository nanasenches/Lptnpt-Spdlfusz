<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Mapa 3D da trajetória</title>
    <link rel="stylesheet" href="/cesium/Widgets/widgets.css" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #7fa9c8;
      }

      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .cesium-viewer-toolbar,
      .cesium-viewer-animationContainer,
      .cesium-viewer-timelineContainer,
      .cesium-viewer-fullscreenContainer {
        display: none !important;
      }

      #loading,
      #error {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        padding: 24px;
        color: white;
        text-align: center;
        background: radial-gradient(circle at center, rgba(28, 53, 75, 0.88), rgba(5, 7, 10, 0.98));
      }

      #error {
        display: none;
      }

      .spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 14px;
        border: 3px solid rgba(255, 255, 255, 0.18);
        border-top-color: #ffffff;
        border-radius: 999px;
        animation: spin 0.9s linear infinite;
      }

      .message {
        max-width: 360px;
        font-size: 14px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.76);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Terreno 3D com imagem de satélite e a trajetória do foguete"></div>
    <div id="loading">
      <div>
        <div class="spinner"></div>
        <div class="message">Carregando imagem de satélite, relevo e trajetória...</div>
      </div>
    </div>
    <div id="error"><div class="message" id="error-message"></div></div>

    <script src="/cesium/Cesium.js"></script>
    <script>
      (() => {
        const ACTIVE_MAP_PROVIDER = 'sentinel-terrain';
        const SATELLITE_URL =
          'https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2025_3857/default/g/{z}/{y}/{x}.jpg';
        const TERRAIN_URL =
          'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
        const TERRAIN_MAX_LEVEL = 13;
        const HEIGHTMAP_SIZE = 64;
        const RECOVERY_INFLATION_DURATION_S = 1.8;
        const RECOVERY_FLIP_DURATION_S = 2.4;
        const RECOVERY_SWAY_FADE_IN_S = 2.2;
        const RECOVERY_SWAY_PITCH_RAD = Cesium.Math.toRadians(5.5);
        const RECOVERY_SWAY_ROLL_RAD = Cesium.Math.toRadians(3.8);
        const RECOVERY_VISUAL_SCALE = 1;
        const OVERVIEW_MINIMUM_ZOOM = 20;
        const OVERVIEW_MAXIMUM_ZOOM = 100000;
        const DEIMOS_MODEL_COORDINATE_SCALE = 0.014847809919781045;
        const DEIMOS_MODEL_ORIGIN_X = -1.0031201296883612;
        const VEHICLE_VISUALS = {
          deimos: {
            name: 'DEIMOS II',
            bodyModel: '/models/deimos-ii-body.glb',
            noseModel: '/models/deimos-ii-nose.glb',
            noseBase: 125.11 * DEIMOS_MODEL_COORDINATE_SCALE + DEIMOS_MODEL_ORIGIN_X,
            nosePivot: 130 * DEIMOS_MODEL_COORDINATE_SCALE + DEIMOS_MODEL_ORIGIN_X,
            modelToBodyRotation: -Cesium.Math.PI_OVER_TWO,
            defaultParachuteDiameter: 1.4,
            closeCameraMinimum: 2.4,
            closeCameraMaximum: 14,
            closeCameraRange: 10.2,
          },
          atlas: {
            name: 'Atlas',
            fullModel: '/models/atlas.glb',
            bodyModel: '/models/atlas-body.glb',
            noseModel: '/models/atlas-nose.glb',
            noseBase: 0.5094,
            nosePivot: 0.54,
            modelToBodyRotation: -Cesium.Math.PI_OVER_TWO,
            defaultParachuteDiameter: 2.71,
            closeCameraMinimum: 3.2,
            closeCameraMaximum: 20,
            closeCameraRange: 12.8,
          },
        };
        const loading = document.getElementById('loading');
        const errorPanel = document.getElementById('error');
        const errorMessage = document.getElementById('error-message');
        let viewer = null;
        let animationState = null;
        let animationFrame = null;
        let lastAnimationNotification = 0;

        function notify(type, detail = {}) {
          window.parent.postMessage({ type, ...detail }, window.location.origin);
        }

        function showError(message) {
          loading.style.display = 'none';
          errorMessage.textContent = message;
          errorPanel.style.display = 'grid';
          notify('TRAJECTORY_MAP_ERROR', { message });
        }

        function readTrajectory(kmlContent) {
          const xml = new DOMParser().parseFromString(kmlContent, 'application/xml');
          if (xml.querySelector('parsererror')) throw new Error('O KML gerado não pôde ser interpretado.');

          const lineStrings = Array.from(xml.getElementsByTagNameNS('*', 'LineString'));
          const coordinatesNode = lineStrings
            .map((line) => line.getElementsByTagNameNS('*', 'coordinates')[0])
            .find(Boolean);
          if (!coordinatesNode?.textContent) throw new Error('O KML não contém uma linha de trajetória.');

          const points = coordinatesNode.textContent
            .trim()
            .split(/\s+/)
            .map((entry) => entry.split(',').map(Number))
            .filter(([longitude, latitude, altitude]) =>
              Number.isFinite(longitude) && Number.isFinite(latitude) && Number.isFinite(altitude),
            )
            .map(([longitude, latitude, altitude]) => ({
              longitude,
              latitude,
              altitudeAgl: Math.max(0, altitude),
            }));

          if (points.length < 2) throw new Error('A trajetória possui poucos pontos para o mapa 3D.');

          const maximumPoints = 1800;
          if (points.length <= maximumPoints) return points;
          const step = Math.ceil(points.length / maximumPoints);
          const sampled = points.filter((_, index) => index % step === 0);
          if (sampled[sampled.length - 1] !== points[points.length - 1]) sampled.push(points[points.length - 1]);
          return sampled;
        }

        function createImageryProvider(providerName) {
          if (providerName !== 'sentinel-terrain') {
            throw new Error(`Provedor de mapa desconhecido: ${providerName}`);
          }
          return new Cesium.UrlTemplateImageryProvider({
            url: SATELLITE_URL,
            minimumLevel: 0,
            maximumLevel: 14,
            tilingScheme: new Cesium.WebMercatorTilingScheme(),
            credit:
              'EOxCloudless by EOX IT Services GmbH (Contains modified Copernicus Sentinel data 2025)',
          });
        }

        async function decodeTerrariumTile(url) {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Elevação indisponível: HTTP ${response.status}`);
          const bitmap = await createImageBitmap(await response.blob());
          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          const context = canvas.getContext('2d', { willReadFrequently: true });
          if (!context) throw new Error('O navegador não conseguiu preparar o relevo.');
          context.drawImage(bitmap, 0, 0);
          bitmap.close?.();
          const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
          const heights = new Float32Array(HEIGHTMAP_SIZE * HEIGHTMAP_SIZE);

          for (let row = 0; row < HEIGHTMAP_SIZE; row += 1) {
            const sourceY = Math.min(
              canvas.height - 1,
              Math.round((row / (HEIGHTMAP_SIZE - 1)) * (canvas.height - 1)),
            );
            for (let column = 0; column < HEIGHTMAP_SIZE; column += 1) {
              const sourceX = Math.min(
                canvas.width - 1,
                Math.round((column / (HEIGHTMAP_SIZE - 1)) * (canvas.width - 1)),
              );
              const pixelIndex = (sourceY * canvas.width + sourceX) * 4;
              heights[row * HEIGHTMAP_SIZE + column] =
                pixels[pixelIndex] * 256 + pixels[pixelIndex + 1] + pixels[pixelIndex + 2] / 256 - 32768;
            }
          }
          return heights;
        }

        function createTerrainProvider(providerName) {
          if (providerName !== 'sentinel-terrain') {
            throw new Error(`Provedor de relevo desconhecido: ${providerName}`);
          }
          return new Cesium.CustomHeightmapTerrainProvider({
            width: HEIGHTMAP_SIZE,
            height: HEIGHTMAP_SIZE,
            tilingScheme: new Cesium.WebMercatorTilingScheme(),
            credit: 'Terrain Tiles by Mapzen, a Linux Foundation project',
            callback(x, y, level) {
              if (level > TERRAIN_MAX_LEVEL) return undefined;
              const url = TERRAIN_URL.replace('{z}', level).replace('{x}', x).replace('{y}', y);
              return decodeTerrariumTile(url).catch(() =>
                new Float32Array(HEIGHTMAP_SIZE * HEIGHTMAP_SIZE),
              );
            },
          });
        }

        async function addGroundHeights(points) {
          const cartographics = points.map((point) =>
            Cesium.Cartographic.fromDegrees(point.longitude, point.latitude),
          );
          try {
            await Cesium.sampleTerrain(viewer.terrainProvider, TERRAIN_MAX_LEVEL, cartographics);
          } catch {
            for (const cartographic of cartographics) cartographic.height = 0;
          }
          return points.map((point, index) => {
            const surfaceHeight = Number.isFinite(cartographics[index].height)
              ? cartographics[index].height
              : 0;
            return {
              ...point,
              surfaceHeight,
              absoluteAltitude: surfaceHeight + point.altitudeAgl,
            };
          });
        }

        function addMarker(point, label, color) {
          viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(
              point.longitude,
              point.latitude,
              point.absoluteAltitude,
            ),
            point: {
              pixelSize: 11,
              color,
              outlineColor: Cesium.Color.WHITE,
              outlineWidth: 2,
              disableDepthTestDistance: Number.POSITIVE_INFINITY,
            },
            label: {
              text: label,
              font: '600 13px Inter, sans-serif',
              fillColor: Cesium.Color.WHITE,
              showBackground: true,
              backgroundColor: Cesium.Color.BLACK.withAlpha(0.72),
              pixelOffset: new Cesium.Cartesian2(0, -24),
              disableDepthTestDistance: Number.POSITIVE_INFINITY,
            },
          });
        }

        function clamp01(value) {
          return Math.max(0, Math.min(1, value));
        }

        function smoothStep(value) {
          const progress = clamp01(value);
          return progress * progress * (3 - 2 * progress);
        }

        function positionFromLocalOffset(position, orientation, offset, result = new Cesium.Cartesian3()) {
          const rotation = Cesium.Matrix3.fromQuaternion(orientation, new Cesium.Matrix3());
          const worldOffset = Cesium.Matrix3.multiplyByVector(
            rotation,
            offset,
            new Cesium.Cartesian3(),
          );
          return Cesium.Cartesian3.add(position, worldOffset, result);
        }

        function combinedOrientation(orientation, localRotation, result = new Cesium.Quaternion()) {
          return Cesium.Quaternion.multiply(orientation, localRotation, result);
        }

        function uprightRecoveryOrientation(position) {
          const enuTransform = Cesium.Transforms.eastNorthUpToFixedFrame(position);
          const enuRotation = Cesium.Matrix4.getMatrix3(
            enuTransform,
            new Cesium.Matrix3(),
          );
          const east = Cesium.Matrix3.getColumn(
            enuRotation,
            0,
            new Cesium.Cartesian3(),
          );
          const north = Cesium.Matrix3.getColumn(
            enuRotation,
            1,
            new Cesium.Cartesian3(),
          );
          const up = Cesium.Matrix3.getColumn(
            enuRotation,
            2,
            new Cesium.Cartesian3(),
          );
          const modelToFixed = Cesium.Matrix3.clone(
            Cesium.Matrix3.IDENTITY,
            new Cesium.Matrix3(),
          );
          Cesium.Matrix3.setColumn(modelToFixed, 0, up, modelToFixed);
          Cesium.Matrix3.setColumn(modelToFixed, 1, east, modelToFixed);
          Cesium.Matrix3.setColumn(modelToFixed, 2, north, modelToFixed);
          return Cesium.Quaternion.fromRotationMatrix(
            modelToFixed,
            new Cesium.Quaternion(),
          );
        }

        function recoveryRigPose(sample, timeAfterDeployment) {
          if (timeAfterDeployment < 0) {
            return {
              position: Cesium.Cartesian3.clone(sample.position),
              orientation: Cesium.Quaternion.clone(sample.orientation),
              sway: 0,
            };
          }

          const flip = smoothStep(
            (timeAfterDeployment - 0.25) / RECOVERY_FLIP_DURATION_S,
          );
          const sway = smoothStep(
            (timeAfterDeployment - 0.65) / RECOVERY_SWAY_FADE_IN_S,
          );
          const upright = uprightRecoveryOrientation(sample.position);
          const pitch = RECOVERY_SWAY_PITCH_RAD
            * Math.sin(timeAfterDeployment * (Cesium.Math.TWO_PI / 4.8))
            * sway;
          const roll = RECOVERY_SWAY_ROLL_RAD
            * Math.sin(timeAfterDeployment * (Cesium.Math.TWO_PI / 3.35) + 0.9)
            * sway;
          const localPitch = Cesium.Quaternion.fromAxisAngle(
            Cesium.Cartesian3.UNIT_Y,
            pitch,
            new Cesium.Quaternion(),
          );
          const localRoll = Cesium.Quaternion.fromAxisAngle(
            Cesium.Cartesian3.UNIT_Z,
            roll,
            new Cesium.Quaternion(),
          );
          const localSway = Cesium.Quaternion.multiply(
            localPitch,
            localRoll,
            new Cesium.Quaternion(),
          );
          const swayingUpright = combinedOrientation(upright, localSway);
          const targetOrientation = Cesium.Quaternion.clone(
            swayingUpright,
            new Cesium.Quaternion(),
          );
          if (Cesium.Quaternion.dot(sample.orientation, targetOrientation) < 0) {
            Cesium.Quaternion.negate(targetOrientation, targetOrientation);
          }
          const orientation = Cesium.Quaternion.slerp(
            sample.orientation,
            targetOrientation,
            flip,
            new Cesium.Quaternion(),
          );
          const position = positionFromLocalOffset(
            sample.position,
            upright,
            new Cesium.Cartesian3(
              0.025 * Math.sin(timeAfterDeployment * 1.7) * sway,
              0.075 * Math.sin(timeAfterDeployment * 1.05) * sway,
              0.055 * Math.sin(timeAfterDeployment * 0.78 + 1.25) * sway,
            ),
          );
          return { position, orientation, sway };
        }

        function clearAnimation() {
          if (animationFrame !== null) cancelAnimationFrame(animationFrame);
          animationFrame = null;
          animationState = null;
          lastAnimationNotification = 0;
        }

        function rocketOrientation(sample, position, vehicle) {
          const magnitude = Math.hypot(sample.e0, sample.e1, sample.e2, sample.e3) || 1;
          const q0 = sample.e0 / magnitude;
          const q1 = sample.e1 / magnitude;
          const q2 = sample.e2 / magnitude;
          const q3 = sample.e3 / magnitude;
          const bodyToEnu = Cesium.Matrix3.fromRowMajorArray([
            1 - 2 * (q2 * q2 + q3 * q3),
            2 * (q1 * q2 - q0 * q3),
            2 * (q1 * q3 + q0 * q2),
            2 * (q1 * q2 + q0 * q3),
            1 - 2 * (q1 * q1 + q3 * q3),
            2 * (q2 * q3 - q0 * q1),
            2 * (q1 * q3 - q0 * q2),
            2 * (q2 * q3 + q0 * q1),
            1 - 2 * (q1 * q1 + q2 * q2),
          ]);
          const enuToFixed = Cesium.Transforms.eastNorthUpToFixedFrame(position);
          const enuToFixedRotation = Cesium.Matrix4.getMatrix3(enuToFixed, new Cesium.Matrix3());
          const bodyToFixed = Cesium.Matrix3.multiply(
            enuToFixedRotation,
            bodyToEnu,
            new Cesium.Matrix3(),
          );
          // Cesium converts the glTF longitudinal +Z axis to its local +X axis.
          // Rotate that local +X back onto RocketPy's body +Z axis, which points
          // from the tail to the nose cone.
          const modelToBody = Cesium.Matrix3.fromRotationY(
            VEHICLE_VISUALS[vehicle]?.modelToBodyRotation
              ?? VEHICLE_VISUALS.deimos.modelToBodyRotation,
            new Cesium.Matrix3(),
          );
          const modelToFixed = Cesium.Matrix3.multiply(
            bodyToFixed,
            modelToBody,
            new Cesium.Matrix3(),
          );
          return Cesium.Quaternion.fromRotationMatrix(modelToFixed, new Cesium.Quaternion());
        }

        function animationSampleAt(time) {
          const samples = animationState.samples;
          if (time <= samples[0].time) return samples[0];
          if (time >= samples[samples.length - 1].time) return samples[samples.length - 1];

          let low = 0;
          let high = samples.length - 1;
          while (high - low > 1) {
            const middle = Math.floor((low + high) / 2);
            if (samples[middle].time <= time) low = middle;
            else high = middle;
          }

          const start = samples[low];
          const end = samples[high];
          const fraction = (time - start.time) / Math.max(0.0001, end.time - start.time);
          const position = Cesium.Cartesian3.lerp(
            start.position,
            end.position,
            fraction,
            new Cesium.Cartesian3(),
          );
          const startOrientation = Cesium.Quaternion.clone(start.orientation, new Cesium.Quaternion());
          const endOrientation = Cesium.Quaternion.clone(end.orientation, new Cesium.Quaternion());
          if (Cesium.Quaternion.dot(startOrientation, endOrientation) < 0) {
            Cesium.Quaternion.negate(endOrientation, endOrientation);
          }
          const orientation = Cesium.Quaternion.slerp(
            startOrientation,
            endOrientation,
            fraction,
            new Cesium.Quaternion(),
          );
          return {
            position,
            orientation,
            altitudeAgl: Cesium.Math.lerp(start.altitudeAgl, end.altitudeAgl, fraction),
          };
        }

        function updateRecoveryAnimation(sample, time) {
          const recovery = animationState.recovery;
          const frame = recovery?.frame;
          const visual = animationState.visual;
          const recoveryEvents = recovery?.events || [];
          if (!recovery?.enabled || recoveryEvents.length === 0) {
            if (frame) {
              frame.assembledVisible = Boolean(visual.fullModel);
              frame.bodyPosition = Cesium.Cartesian3.clone(sample.position);
              frame.bodyOrientation = Cesium.Quaternion.clone(sample.orientation);
              frame.nosePosition = Cesium.Cartesian3.clone(sample.position);
              frame.noseOrientation = Cesium.Quaternion.clone(sample.orientation);
              frame.canopyPosition = Cesium.Cartesian3.clone(sample.position);
              frame.canopyOrientation = Cesium.Quaternion.clone(sample.orientation);
              frame.canopyRadii = new Cesium.Cartesian3(0.001, 0.001, 0.001);
              frame.canopyVisible = false;
              frame.bodyTetherPositions = [];
              frame.bodyTetherVisible = false;
              frame.noseTetherPositions = [];
              frame.noseTetherVisible = false;
              frame.bridlePositions = [[], [], [], []];
              frame.bridlesVisible = false;
              frame.cameraTarget = Cesium.Cartesian3.clone(sample.position);
              frame.cameraMinimumRange = visual.closeCameraRange;
            }
            return;
          }

          const firstDeploymentTime = recoveryEvents[0].deploymentTime;
          const timeAfterDeployment = time - firstDeploymentTime;
          const separation = smoothStep(timeAfterDeployment / 0.7);
          const extraction = smoothStep((timeAfterDeployment - 0.18) / 0.95);
          const inflation = smoothStep(
            (timeAfterDeployment - 0.45) / RECOVERY_INFLATION_DURATION_S,
          );
          let activeEventIndex = -1;
          for (let index = 0; index < recoveryEvents.length; index += 1) {
            if (time >= recoveryEvents[index].deploymentTime) activeEventIndex = index;
          }
          const activeEvent = recoveryEvents[Math.max(0, activeEventIndex)];
          const previousDiameter = activeEventIndex > 0
            ? recoveryEvents[activeEventIndex - 1].diameter
            : 0;
          const activeInflation = activeEventIndex >= 0
            ? smoothStep(
              (time - activeEvent.deploymentTime - 0.45)
                / RECOVERY_INFLATION_DURATION_S,
            )
            : 0;
          const canopyDiameter = previousDiameter
            + (activeEvent.diameter - previousDiameter) * activeInflation;
          const deployed = timeAfterDeployment >= 0;
          const rigPose = recoveryRigPose(sample, timeAfterDeployment);
          frame.assembledVisible = Boolean(visual.fullModel) && !deployed;
          frame.bodyPosition = rigPose.position;
          frame.bodyOrientation = rigPose.orientation;

          const localNoseRotation = Cesium.Quaternion.fromAxisAngle(
            Cesium.Cartesian3.UNIT_Z,
            Cesium.Math.PI * separation,
            new Cesium.Quaternion(),
          );
          const noseRotationMatrix = Cesium.Matrix3.fromQuaternion(
            localNoseRotation,
            new Cesium.Matrix3(),
          );
          const nosePivot = new Cesium.Cartesian3(visual.nosePivot, 0, 0);
          const rotatedNosePivot = Cesium.Matrix3.multiplyByVector(
            noseRotationMatrix,
            nosePivot,
            new Cesium.Cartesian3(),
          );
          const noseOffset = new Cesium.Cartesian3(
            0.54 * separation + nosePivot.x - rotatedNosePivot.x,
            0.64 * separation + nosePivot.y - rotatedNosePivot.y,
            -0.18 * separation + nosePivot.z - rotatedNosePivot.z,
          );
          const nosePosition = positionFromLocalOffset(
            rigPose.position,
            rigPose.orientation,
            noseOffset,
          );
          const noseOrientation = combinedOrientation(rigPose.orientation, localNoseRotation);
          frame.nosePosition = nosePosition;
          frame.noseOrientation = noseOrientation;

          const canopyCenterLocal = new Cesium.Cartesian3(
            visual.nosePivot + 1.5 * extraction,
            -0.08 * extraction + 0.035 * Math.sin(timeAfterDeployment * 1.35) * rigPose.sway,
            0.05 * Math.sin(timeAfterDeployment * 1.8) * inflation,
          );
          const canopyPosition = positionFromLocalOffset(
            rigPose.position,
            rigPose.orientation,
            canopyCenterLocal,
          );
          const canopyLocalRotation = Cesium.Quaternion.fromAxisAngle(
            Cesium.Cartesian3.UNIT_Y,
            Cesium.Math.PI_OVER_TWO,
            new Cesium.Quaternion(),
          );
          frame.canopyPosition = canopyPosition;
          frame.canopyOrientation = combinedOrientation(
            rigPose.orientation,
            canopyLocalRotation,
          );
          frame.canopyVisible = canopyDiameter > 0.02;
          frame.canopyRadii = new Cesium.Cartesian3(
            Math.max(0.01, canopyDiameter * RECOVERY_VISUAL_SCALE * 0.5),
            Math.max(0.01, canopyDiameter * RECOVERY_VISUAL_SCALE * 0.5),
            Math.max(0.006, 0.19 * canopyDiameter),
          );
          const bodyAttachment = positionFromLocalOffset(
            rigPose.position,
            rigPose.orientation,
            new Cesium.Cartesian3(visual.noseBase, 0, 0),
          );
          const harnessLocal = new Cesium.Cartesian3(
            canopyCenterLocal.x - 0.31 * inflation,
            canopyCenterLocal.y,
            canopyCenterLocal.z,
          );
          const harness = positionFromLocalOffset(
            rigPose.position,
            rigPose.orientation,
            harnessLocal,
          );
          const bodyTetherMiddle = positionFromLocalOffset(
            rigPose.position,
            rigPose.orientation,
            new Cesium.Cartesian3(
              (visual.noseBase + harnessLocal.x) * 0.5,
              -0.1 * extraction + 0.025 * Math.sin(timeAfterDeployment * 1.2) * rigPose.sway,
              0.08 * extraction,
            ),
          );
          frame.bodyTetherPositions = [bodyAttachment, bodyTetherMiddle, harness];
          frame.bodyTetherVisible = deployed && extraction > 0.04;

          const noseAnchor = positionFromLocalOffset(
            nosePosition,
            noseOrientation,
            new Cesium.Cartesian3(visual.noseBase, 0, 0),
          );
          const noseTetherMiddle = Cesium.Cartesian3.midpoint(
            noseAnchor,
            harness,
            new Cesium.Cartesian3(),
          );
          const retentionSag = positionFromLocalOffset(
            noseTetherMiddle,
            rigPose.orientation,
            new Cesium.Cartesian3(0, 0, -0.12 * separation),
          );
          frame.noseTetherPositions = [noseAnchor, retentionSag, harness];
          frame.noseTetherVisible = deployed && separation > 0.04;

          const radius = canopyDiameter * RECOVERY_VISUAL_SCALE * 0.5;
          const rimOffsets = [
            new Cesium.Cartesian3(canopyCenterLocal.x, canopyCenterLocal.y - radius * 0.82, canopyCenterLocal.z),
            new Cesium.Cartesian3(canopyCenterLocal.x, canopyCenterLocal.y + radius * 0.82, canopyCenterLocal.z),
            new Cesium.Cartesian3(canopyCenterLocal.x, canopyCenterLocal.y, canopyCenterLocal.z - radius * 0.82),
            new Cesium.Cartesian3(canopyCenterLocal.x, canopyCenterLocal.y, canopyCenterLocal.z + radius * 0.82),
          ];
          frame.bridlePositions = rimOffsets.map((offset) => {
            const rim = positionFromLocalOffset(
              rigPose.position,
              rigPose.orientation,
              offset,
            );
            return [harness, rim];
          });
          frame.bridlesVisible = canopyDiameter > 0.08;

          const focusLocal = new Cesium.Cartesian3(
            Math.max(0, canopyCenterLocal.x) * inflation * 0.46,
            canopyCenterLocal.y * inflation * 0.35,
            canopyCenterLocal.z * inflation * 0.35,
          );
          frame.cameraTarget = positionFromLocalOffset(
            rigPose.position,
            rigPose.orientation,
            focusLocal,
          );
          frame.cameraMinimumRange = visual.closeCameraRange + 0.9 * canopyDiameter;
        }

        function closeCameraOrbit() {
          const target = animationState?.recovery?.frame?.cameraTarget;
          const visual = animationState?.visual || VEHICLE_VISUALS.deimos;
          return {
            heading: viewer.camera.heading,
            pitch: Math.max(
              Cesium.Math.toRadians(-82),
              Math.min(Cesium.Math.toRadians(18), viewer.camera.pitch),
            ),
            range: Math.max(
              visual.closeCameraMinimum,
              Math.min(
                visual.closeCameraMaximum,
                target
                  ? Cesium.Cartesian3.distance(viewer.camera.positionWC, target)
                  : visual.closeCameraRange,
              ),
            ),
          };
        }

        function applyCloseCamera(orbit = null) {
          if (animationState?.cameraMode !== 'rocket') return;
          const target = animationState.recovery.frame.cameraTarget;
          if (!target) return;
          const nextOrbit = orbit || {
            heading: Cesium.Math.toRadians(-32),
            pitch: Cesium.Math.toRadians(-8),
            range: animationState.visual.closeCameraRange,
          };
          viewer.camera.lookAt(
            target,
            new Cesium.HeadingPitchRange(
              nextOrbit.heading,
              nextOrbit.pitch,
              Math.max(
                nextOrbit.range,
                animationState.recovery.frame.cameraMinimumRange,
              ),
            ),
          );
        }

        function setCameraMode(mode) {
          if (!animationState) return;
          const closeMode = mode === 'rocket';
          animationState.cameraMode = closeMode ? 'rocket' : 'overview';
          const controller = viewer.scene.screenSpaceCameraController;

          if (closeMode) {
            controller.enableTranslate = false;
            controller.enableLook = false;
            controller.enableRotate = true;
            controller.enableTilt = true;
            controller.enableZoom = true;
            controller.enableCollisionDetection = false;
            controller.minimumZoomDistance = animationState.visual.closeCameraMinimum;
            controller.maximumZoomDistance = animationState.visual.closeCameraMaximum;
            viewer.trackedEntity = undefined;
            applyCloseCamera();
          } else {
            viewer.trackedEntity = undefined;
            viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
            controller.enableTranslate = true;
            controller.enableLook = true;
            controller.enableCollisionDetection = true;
            controller.minimumZoomDistance = OVERVIEW_MINIMUM_ZOOM;
            controller.maximumZoomDistance = OVERVIEW_MAXIMUM_ZOOM;
            viewer.flyTo(viewer.entities, {
              duration: 0.85,
              offset: new Cesium.HeadingPitchRange(
                Cesium.Math.toRadians(-28),
                Cesium.Math.toRadians(-24),
                0,
              ),
            }).catch(() => {});
          }
          viewer.scene.requestRender();
        }

        function applyAnimationTime(time, notifyParent = true) {
          if (!animationState) return;
          const orbit = animationState.cameraMode === 'rocket' ? closeCameraOrbit() : null;
          const nextTime = Math.min(animationState.duration, Math.max(0, Number(time) || 0));
          const sample = animationSampleAt(nextTime);
          animationState.currentTime = nextTime;
          updateRecoveryAnimation(sample, nextTime);
          applyCloseCamera(orbit);
          viewer.scene.requestRender();
          if (notifyParent) {
            notify('TRAJECTORY_ANIMATION_TICK', {
              currentTime: nextTime,
              playing: animationState.playing,
            });
          }
        }

        function animateFrame(timestamp) {
          animationFrame = null;
          if (!animationState?.playing) return;
          if (!animationState.playStartedAt) {
            animationState.playStartedAt = timestamp;
            animationState.playStartedTime = animationState.currentTime;
          }
          animationState.lastFrameTime = timestamp;
          const nextTime = animationState.playStartedTime
            + Math.max(0, (timestamp - animationState.playStartedAt) / 1000);
          if (nextTime >= animationState.duration) {
            animationState.playing = false;
            applyAnimationTime(animationState.duration, true);
            return;
          }
          applyAnimationTime(nextTime, false);
          if (timestamp - lastAnimationNotification >= 90) {
            lastAnimationNotification = timestamp;
            notify('TRAJECTORY_ANIMATION_TICK', {
              currentTime: animationState.currentTime,
              playing: true,
            });
          }
          animationFrame = requestAnimationFrame(animateFrame);
        }

        function setAnimationPlaying(playing) {
          if (!animationState) return;
          if (playing && animationState.currentTime >= animationState.duration) {
            applyAnimationTime(0, false);
          }
          animationState.playing = Boolean(playing);
          animationState.lastFrameTime = 0;
          animationState.playStartedAt = 0;
          animationState.playStartedTime = animationState.currentTime;
          if (animationFrame !== null) cancelAnimationFrame(animationFrame);
          animationFrame = null;
          notify('TRAJECTORY_ANIMATION_TICK', {
            currentTime: animationState.currentTime,
            playing: animationState.playing,
          });
          if (animationState.playing) animationFrame = requestAnimationFrame(animateFrame);
        }

        async function prepareAnimation(rawSamples, vehicle, recoveryOptions = {}) {
          const visual = VEHICLE_VISUALS[vehicle] || VEHICLE_VISUALS.deimos;
          const validSamples = rawSamples
            .filter((sample) =>
              [
                sample.time_s,
                sample.latitude_deg,
                sample.longitude_deg,
                sample.altitude_agl_m,
                sample.e0,
                sample.e1,
                sample.e2,
                sample.e3,
              ].every(Number.isFinite),
            )
            .sort((left, right) => left.time_s - right.time_s);
          if (validSamples.length < 2) return;

          const elevatedSamples = await addGroundHeights(
            validSamples.map((sample) => ({
              ...sample,
              longitude: sample.longitude_deg,
              latitude: sample.latitude_deg,
              altitudeAgl: Math.max(0, sample.altitude_agl_m),
            })),
          );
          const samples = elevatedSamples.map((sample) => {
            const position = Cesium.Cartesian3.fromDegrees(
              sample.longitude,
              sample.latitude,
              sample.absoluteAltitude,
            );
            return {
              time: sample.time_s,
              position,
              orientation: rocketOrientation(sample, position, vehicle),
              altitudeAgl: sample.altitudeAgl,
            };
          });
          const apogeeSample = samples.reduce((highest, sample) =>
            sample.altitudeAgl > highest.altitudeAgl ? sample : highest,
          );
          const explicitDeploymentTime = recoveryOptions.deploymentTime;
          const suppliedEvents = Array.isArray(recoveryOptions.events)
            ? recoveryOptions.events
              .filter((event) => Number.isFinite(Number(event?.deployment_time_s)))
              .map((event) => ({
                name: String(event.name || 'Paraquedas'),
                kind: event.kind === 'drogue' ? 'drogue' : 'main',
                deploymentTime: Number(event.deployment_time_s),
                diameter: Number.isFinite(Number(event.diameter_m))
                  ? Number(event.diameter_m)
                  : visual.defaultParachuteDiameter,
              }))
              .sort((left, right) => left.deploymentTime - right.deploymentTime)
            : [];
          const fallbackDeploymentTime = typeof explicitDeploymentTime === 'number'
            && Number.isFinite(explicitDeploymentTime)
              ? explicitDeploymentTime
              : apogeeSample.time + 5.5;
          const recoveryEvents = suppliedEvents.length > 0
            ? suppliedEvents
            : [{
              name: `Paraquedas principal do ${visual.name}`,
              kind: 'main',
              deploymentTime: fallbackDeploymentTime,
              diameter: visual.defaultParachuteDiameter,
            }];
          const deploymentTime = recoveryEvents[0].deploymentTime;
          const recoveryEnabled = recoveryOptions.enabled !== false
            && deploymentTime < samples[samples.length - 1].time;
          const initialPosition = Cesium.Cartesian3.clone(samples[0].position);
          const initialOrientation = Cesium.Quaternion.clone(samples[0].orientation);
          const frame = {
            assembledVisible: Boolean(visual.fullModel),
            bodyPosition: Cesium.Cartesian3.clone(initialPosition),
            bodyOrientation: Cesium.Quaternion.clone(initialOrientation),
            nosePosition: Cesium.Cartesian3.clone(initialPosition),
            noseOrientation: Cesium.Quaternion.clone(initialOrientation),
            canopyPosition: Cesium.Cartesian3.clone(initialPosition),
            canopyOrientation: Cesium.Quaternion.clone(initialOrientation),
            canopyRadii: new Cesium.Cartesian3(0.001, 0.001, 0.001),
            canopyVisible: false,
            bodyTetherPositions: [],
            bodyTetherVisible: false,
            noseTetherPositions: [],
            noseTetherVisible: false,
            bridlePositions: [[], [], [], []],
            bridlesVisible: false,
            cameraTarget: Cesium.Cartesian3.clone(initialPosition),
            cameraMinimumRange: visual.closeCameraRange,
          };
          const assembledEntity = visual.fullModel ? viewer.entities.add({
            name: `${visual.name} montado`,
            position: new Cesium.CallbackPositionProperty(
              (_time, result) => Cesium.Cartesian3.clone(frame.bodyPosition, result),
              false,
            ),
            orientation: new Cesium.CallbackProperty(
              (_time, result) => Cesium.Quaternion.clone(frame.bodyOrientation, result),
              false,
            ),
            model: {
              uri: visual.fullModel,
              show: new Cesium.CallbackProperty(() => frame.assembledVisible, false),
              minimumPixelSize: 58,
              maximumScale: 80,
              runAnimations: false,
              shadows: Cesium.ShadowMode.DISABLED,
              silhouetteColor: Cesium.Color.WHITE.withAlpha(0.34),
              silhouetteSize: 0.65,
            },
          }) : null;
          const bodyEntity = viewer.entities.add({
            name: `${visual.name} animado`,
            position: new Cesium.CallbackPositionProperty(
              (_time, result) => Cesium.Cartesian3.clone(frame.bodyPosition, result),
              false,
            ),
            orientation: new Cesium.CallbackProperty(
              (_time, result) => Cesium.Quaternion.clone(frame.bodyOrientation, result),
              false,
            ),
            model: {
              uri: visual.bodyModel,
              show: new Cesium.CallbackProperty(() => !frame.assembledVisible, false),
              minimumPixelSize: 0,
              maximumScale: 1,
              runAnimations: false,
              shadows: Cesium.ShadowMode.DISABLED,
              silhouetteColor: Cesium.Color.WHITE.withAlpha(0.34),
              silhouetteSize: 0.65,
            },
          });
          const noseEntity = viewer.entities.add({
            name: `Coifa do ${visual.name}`,
            position: new Cesium.CallbackPositionProperty(
              (_time, result) => Cesium.Cartesian3.clone(frame.nosePosition, result),
              false,
            ),
            orientation: new Cesium.CallbackProperty(
              (_time, result) => Cesium.Quaternion.clone(frame.noseOrientation, result),
              false,
            ),
            model: {
              uri: visual.noseModel,
              show: new Cesium.CallbackProperty(() => !frame.assembledVisible, false),
              minimumPixelSize: 0,
              maximumScale: 1,
              runAnimations: false,
              shadows: Cesium.ShadowMode.DISABLED,
              silhouetteColor: Cesium.Color.WHITE.withAlpha(0.3),
              silhouetteSize: 0.55,
            },
          });
          const canopyEntity = viewer.entities.add({
            name: `Sistema de recuperação do ${visual.name}`,
            position: new Cesium.CallbackPositionProperty(
              (_time, result) => Cesium.Cartesian3.clone(frame.canopyPosition, result),
              false,
            ),
            orientation: new Cesium.CallbackProperty(
              (_time, result) => Cesium.Quaternion.clone(frame.canopyOrientation, result),
              false,
            ),
            ellipsoid: {
              show: new Cesium.CallbackProperty(() => frame.canopyVisible, false),
              radii: new Cesium.CallbackProperty(
                (_time, result) => Cesium.Cartesian3.clone(frame.canopyRadii, result),
                false,
              ),
              minimumCone: 0,
              maximumCone: Cesium.Math.PI_OVER_TWO,
              material: Cesium.Color.fromCssColorString('#ff7a18').withAlpha(0.9),
              outline: true,
              outlineColor: Cesium.Color.fromCssColorString('#ffb15c').withAlpha(0.95),
              slicePartitions: 48,
              stackPartitions: 18,
              shadows: Cesium.ShadowMode.DISABLED,
            },
          });
          const addRecoveryLine = (name, color, width, positions, visible) => viewer.entities.add({
            name,
            polyline: {
              show: new Cesium.CallbackProperty(visible, false),
              positions: new Cesium.CallbackProperty(positions, false),
              width,
              material: color,
              depthFailMaterial: color.withAlpha(0.72),
              arcType: Cesium.ArcType.NONE,
            },
          });
          const bodyTether = addRecoveryLine(
            'Tirante principal do paraquedas',
            Cesium.Color.WHITE.withAlpha(0.94),
            2.2,
            () => frame.bodyTetherPositions,
            () => frame.bodyTetherVisible,
          );
          const noseTether = addRecoveryLine(
            'Cordinha de retenção da coifa',
            Cesium.Color.fromCssColorString('#ffd166').withAlpha(0.98),
            2.4,
            () => frame.noseTetherPositions,
            () => frame.noseTetherVisible,
          );
          const bridles = Array.from({ length: 4 }, (_, index) => addRecoveryLine(
            `Suspensão do paraquedas ${index + 1}`,
            Cesium.Color.WHITE.withAlpha(0.82),
            1.35,
            () => frame.bridlePositions[index],
            () => frame.bridlesVisible,
          ));
          animationState = {
            samples,
            visual,
            entity: bodyEntity,
            duration: samples[samples.length - 1].time,
            currentTime: 0,
            playing: false,
            lastFrameTime: 0,
            playStartedAt: 0,
            playStartedTime: 0,
            cameraMode: 'overview',
            recovery: {
              enabled: recoveryEnabled,
              deploymentTime,
              events: recoveryEvents,
              frame,
              assembledEntity,
              noseEntity,
              canopyEntity,
              bodyTether,
              noseTether,
              bridles,
            },
          };
          applyAnimationTime(0, false);
          notify('TRAJECTORY_ANIMATION_READY', {
            currentTime: 0,
            duration: animationState.duration,
            playing: false,
            recoveryDeploymentTime: recoveryEnabled ? deploymentTime : null,
            recoveryEvents: recoveryEnabled ? recoveryEvents : [],
          });
        }

        async function renderTrajectory(
          kmlContent,
          vehicle,
          animationTrajectory,
          parachuteDeploymentTime,
          parachuteEvents,
          recoveryEnabled,
        ) {
          const rawPoints = readTrajectory(kmlContent);
          const points = await addGroundHeights(rawPoints);
          const accent = Cesium.Color.fromCssColorString(vehicle === 'atlas' ? '#5ba6ff' : '#ff1493');
          const positions = Cesium.Cartesian3.fromDegreesArrayHeights(
            points.flatMap((point) => [point.longitude, point.latitude, point.absoluteAltitude]),
          );

          clearAnimation();
          viewer.entities.removeAll();
          viewer.entities.add({
            name: 'Trajetória do foguete',
            polyline: {
              positions,
              width: 5,
              material: new Cesium.PolylineGlowMaterialProperty({
                glowPower: 0.18,
                taperPower: 0.45,
                color: accent,
              }),
              arcType: Cesium.ArcType.NONE,
            },
          });
          viewer.entities.add({
            name: 'Projeção da trajetória',
            wall: {
              positions,
              minimumHeights: points.map((point) => point.surfaceHeight),
              material: accent.withAlpha(0.16),
              outline: false,
            },
          });

          const apogee = points.reduce((highest, point) =>
            point.altitudeAgl > highest.altitudeAgl ? point : highest,
          );
          addMarker(points[0], 'Lançamento', Cesium.Color.fromCssColorString('#35d07f'));
          addMarker(apogee, `Apogeu ${Math.round(apogee.altitudeAgl)} m AGL`, accent);
          addMarker(points[points.length - 1], 'Impacto', Cesium.Color.fromCssColorString('#ff625f'));

          if (Array.isArray(animationTrajectory)) {
            await prepareAnimation(animationTrajectory, vehicle, {
              deploymentTime: parachuteDeploymentTime,
              events: parachuteEvents,
              enabled: recoveryEnabled,
            });
          }

          await viewer.flyTo(viewer.entities, {
            duration: 1.2,
            offset: new Cesium.HeadingPitchRange(
              Cesium.Math.toRadians(-28),
              Cesium.Math.toRadians(-24),
              0,
            ),
          });
          loading.style.display = 'none';
          errorPanel.style.display = 'none';
          viewer.scene.requestRender();
          notify('TRAJECTORY_MAP_RENDERED', {
            pointCount: points.length,
            mapProvider: ACTIVE_MAP_PROVIDER,
            offline: !navigator.onLine,
          });
        }

        try {
          if (!window.Cesium) {
            throw new Error('O módulo local do mapa 3D não foi carregado. Atualize o pacote offline.');
          }

          const imageryProvider = createImageryProvider(ACTIVE_MAP_PROVIDER);
          const terrainProvider = createTerrainProvider(ACTIVE_MAP_PROVIDER);
          viewer = new Cesium.Viewer('map', {
            baseLayer: new Cesium.ImageryLayer(imageryProvider),
            terrainProvider,
            animation: false,
            baseLayerPicker: false,
            fullscreenButton: false,
            geocoder: false,
            homeButton: false,
            infoBox: false,
            navigationHelpButton: false,
            sceneModePicker: false,
            selectionIndicator: false,
            timeline: false,
            requestRenderMode: true,
            maximumRenderTimeChange: Number.POSITIVE_INFINITY,
          });
          viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#7fa9c8');
          viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#304b39');
          viewer.scene.globe.enableLighting = true;
          viewer.scene.globe.showGroundAtmosphere = true;
          viewer.scene.globe.depthTestAgainstTerrain = true;
          viewer.scene.skyAtmosphere.show = true;
          viewer.scene.fog.enabled = true;
          viewer.scene.fog.density = 0.00012;
          viewer.scene.screenSpaceCameraController.minimumZoomDistance = OVERVIEW_MINIMUM_ZOOM;
          viewer.scene.screenSpaceCameraController.maximumZoomDistance = OVERVIEW_MAXIMUM_ZOOM;

          window.addEventListener('message', (event) => {
            if (event.origin !== window.location.origin) return;
            if (event.data?.type === 'LOAD_TRAJECTORY_KML') {
              renderTrajectory(
                event.data.kmlContent,
                event.data.vehicle,
                event.data.animationTrajectory,
                event.data.parachuteDeploymentTime,
                event.data.parachuteEvents,
                event.data.recoveryEnabled,
              ).catch((error) => {
                showError(error instanceof Error ? error.message : String(error));
              });
            }
            if (event.data?.type === 'SET_TRAJECTORY_ANIMATION_PLAYING') {
              setAnimationPlaying(event.data.playing);
            }
            if (event.data?.type === 'SET_TRAJECTORY_ANIMATION_TIME') {
              if (animationState) {
                animationState.playing = false;
                animationState.lastFrameTime = 0;
                animationState.playStartedAt = 0;
                animationState.playStartedTime = Number(event.data.time_s) || 0;
                if (animationFrame !== null) cancelAnimationFrame(animationFrame);
                animationFrame = null;
                applyAnimationTime(event.data.time_s, true);
              }
            }
            if (event.data?.type === 'SET_TRAJECTORY_CAMERA_MODE') {
              setCameraMode(event.data.mode);
            }
          });
          notify('TRAJECTORY_MAP_READY', { mapProvider: ACTIVE_MAP_PROVIDER });
        } catch (error) {
          showError(error instanceof Error ? error.message : String(error));
        }
      })();
    </script>
  </body>
</html>
